name: tauhorse-shop

services:
  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: horse_shop
      POSTGRES_USER: horse_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horse_shop -d horse_shop"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql://horse_shop:${POSTGRES_PASSWORD}@db:5432/horse_shop?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NUXT_JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      NUXT_JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      NUXT_JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      NUXT_JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PRODUCTION_DEPLOYMENT: "true"
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:?Set NUXT_PUBLIC_APP_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NUXT_PUBLIC_SHOP_NAME: ${NUXT_PUBLIC_SHOP_NAME:-TauHorse}
      NUXT_PUBLIC_BRAND_NAME: ${NUXT_PUBLIC_BRAND_NAME:-TauHorse}
      NUXT_PUBLIC_CONTACT_PERSON: ${NUXT_PUBLIC_CONTACT_PERSON:-Юлия Котова}
      NUXT_PUBLIC_SOCIAL_MAX: ${NUXT_PUBLIC_SOCIAL_MAX:-https://max.ru/u/f9LHodD0cOIOGWFsEvii_RphX3uoWncwmI6Cmhe8CIJ6NIbYsUrdgfSyWLM}
      NUXT_PUBLIC_SOCIAL_WHATSAPP: ${NUXT_PUBLIC_SOCIAL_WHATSAPP:-https://wa.me/79013520534}
      NUXT_PUBLIC_SOCIAL_AVITO: ${NUXT_PUBLIC_SOCIAL_AVITO:-https://www.avito.ru/dolgoprudnyy/tovary_dlya_zhivotnyh/lizunets_konfeta_dlya_loshadey_8222244356}
      NUXT_PUBLIC_RELATED_PROJECT_URL: ${NUXT_PUBLIC_RELATED_PROJECT_URL:-https://ledenkon.ru/}
      NUXT_PUBLIC_SHOP_EMAIL: ${NUXT_PUBLIC_SHOP_EMAIL:-zoloto666@inbox.ru}
      NUXT_PUBLIC_SHOP_PHONE: ${NUXT_PUBLIC_SHOP_PHONE:-+79013520534}
      NUXT_PUBLIC_SHOP_PHONE_DISPLAY: ${NUXT_PUBLIC_SHOP_PHONE_DISPLAY:-+7 901 352-05-34}
      NUXT_PUBLIC_SHOP_ADDRESS: ${NUXT_PUBLIC_SHOP_ADDRESS:-г. Долгопрудный, Хлебниково, ул. Ленинградская, д. 24}
      NUXT_PUBLIC_SELLER_NAME: ${NUXT_PUBLIC_SELLER_NAME:-ИП Туманова Елена Владимировна}
      NUXT_PUBLIC_SELLER_ID: ${NUXT_PUBLIC_SELLER_ID:-321508100345153}
      NUXT_PUBLIC_SELLER_INN: ${NUXT_PUBLIC_SELLER_INN:-507803101860}
      NUXT_PUBLIC_SELLER_OGRNIP: ${NUXT_PUBLIC_SELLER_OGRNIP:-321508100345153}
      NUXT_PUBLIC_SELLER_LEGAL_ADDRESS: ${NUXT_PUBLIC_SELLER_LEGAL_ADDRESS:-г. Долгопрудный, Хлебниково, ул. Ленинградская, д. 24}
      NUXT_PUBLIC_SELLER_REGISTRATION_AUTHORITY: ${NUXT_PUBLIC_SELLER_REGISTRATION_AUTHORITY:-}
      NUXT_PUBLIC_CLAIMS_EMAIL: ${NUXT_PUBLIC_CLAIMS_EMAIL:-zoloto666@inbox.ru}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ORDER_NOTIFICATION_EMAIL: ${ORDER_NOTIFICATION_EMAIL:-}
      MEDIA_ROOT: /app/uploads
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-26214400}
      MEDIA_MAX_REQUEST_BYTES: ${MEDIA_MAX_REQUEST_BYTES:-62914560}
    volumes:
      - product_media:/app/uploads
    expose:
      - "3000"
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      NGINX_RELOAD_SECONDS: ${NGINX_RELOAD_SECONDS:-21600}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/start-nginx.sh:/usr/local/bin/start-nginx.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - product_media:/srv/media:ro
    command: ["/bin/sh", "/usr/local/bin/start-nginx.sh"]
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

  nginx-bootstrap:
    image: nginx:1.30.5-alpine
    profiles: ["bootstrap"]
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      CERTBOT_RENEW_INTERVAL_SECONDS: ${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./nginx/certbot-renew.sh:/usr/local/bin/certbot-renew.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-renew.sh"]
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  backup:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: horse_shop
      PGUSER: horse_shop
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: >-
      sh -ec 'while true; do
      ts=$$(date +%Y%m%d_%H%M%S);
      tmp=/backups/.horse_shop_$${ts}.dump.tmp;
      out=/backups/horse_shop_$${ts}.dump;
      rm -f "$$tmp";
      pg_dump --format=custom --file="$$tmp";
      mv "$$tmp" "$$out";
      find /backups -type f -name "horse_shop_*.dump" -mtime +$$BACKUP_RETENTION_DAYS -delete;
      sleep "$$BACKUP_INTERVAL_SECONDS";
      done'
    volumes:
      - postgres_backups:/backups
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

networks:
  frontend:
  backend:
    internal: true

volumes:
  product_media:
    name: horse_feed_shop_media
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-horse_feed_shop_postgres}
  postgres_backups:
    name: horse_feed_shop_backups
  letsencrypt:
    name: horse_feed_shop_letsencrypt
  certbot_www:
    name: horse_feed_shop_certbot_www
