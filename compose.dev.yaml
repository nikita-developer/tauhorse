services:
  app:
    build:
      target: deps
    command: >
      sh -lc "npm run prisma:generate &&
              npm run prisma:deploy &&
              npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      PRODUCTION_DEPLOYMENT: "false"
      COOKIE_SECURE: "false"
      NUXT_PUBLIC_APP_URL: http://localhost:3001
    read_only: false
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
      - prisma_cache:/root/.cache/prisma

volumes:
  dev_node_modules:
  prisma_cache:
