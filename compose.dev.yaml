name: tauhorse-dev

services:
  app:
    image: node:22-bookworm
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 3000

    env_file:
      - .env.local

    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      MEDIA_ROOT: /app/uploads

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - uploads:/app/uploads

    networks:
      - dev

networks:
  dev:
    external: true
    name: tauhorse-dev-net

volumes:
  node_modules:
    external: true
    name: tauhorse_dev_node_modules

  uploads:
    name: tauhorse_dev_uploads
