# Home/public test overlay for https://test.tauhorse.ru (or another test domain).
# Run with: ./scripts/deploy-test.sh
services:
  app:
    environment:
      NUXT_PUBLIC_APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
      COOKIE_SECURE: "true"

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      NGINX_RELOAD_SECONDS: ${NGINX_RELOAD_SECONDS:-21600}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/start-nginx.sh:/usr/local/bin/start-nginx.sh:ro
      - test_letsencrypt:/etc/letsencrypt:ro
      - test_certbot_www:/var/www/certbot:ro
      - product_media:/srv/media:ro
    command: ["/bin/sh", "/usr/local/bin/start-nginx.sh"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx-bootstrap:
    image: nginx:1.30.5-alpine
    profiles: ["bootstrap"]
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf.template:/etc/nginx/templates/default.conf.template:ro
      - test_certbot_www:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      CERTBOT_RENEW_INTERVAL_SECONDS: ${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
    volumes:
      - test_letsencrypt:/etc/letsencrypt
      - test_certbot_www:/var/www/certbot
      - ./nginx/certbot-renew.sh:/usr/local/bin/certbot-renew.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-renew.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  test_letsencrypt:
    name: horse_feed_shop_test_letsencrypt
  test_certbot_www:
    name: horse_feed_shop_test_certbot_www
